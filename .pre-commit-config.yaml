repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pytest-check
        name: pytest (unit + integration)
        entry: uv run pytest -n auto --cov=app --cov-fail-under=85
        language: system
        pass_filenames: false
        always_run: true