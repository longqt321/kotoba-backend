[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "alembic>=1.18.5",
    "authlib>=1.7.2",
    "fastapi[standard]>=0.139.0",
    "fsrs>=4.0,<5",
    "itsdangerous>=2.2.0",
    "psycopg2-binary>=2.9.12",
    "ruff>=0.15.22",
    "sqlmodel>=0.0.39",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3",
    "faker>=26.0",
    "freezegun>=1.5",
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-randomly>=3.15",
    "pytest-xdist>=3.6",
    "respx>=0.21",
    "ruff>=0.6",
]


[tool.ruff]
line-length = 100
target-version = "py313"

exclude = [
    "app/alembic/versions/*",
]

[tool.ruff.lint]
# Lựa chọn các bộ quy tắc (rules) để kiểm tra
# E/W: Lỗi/Cảnh báo style chung (Pycodestyle)
# F: Lỗi logic cơ bản (Pyflakes)
# I: Sắp xếp import (isort)
# B: Các lỗi tiềm ẩn dễ gặp (flake8-bugbear)
# UP: Nâng cấp cú pháp Python mới (pyupgrade)
select = ["E", "W", "F", "I", "B", "UP"]

ignore = [
    "B008",
]

fixable = ["ALL"]
unfixable = []

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"         # Sử dụng nháy kép "" cho chuỗi string
indent-style = "space"         # Sử dụng dấu cách (space) thay vì tab
skip-magic-trailing-comma = false # Giữ nguyên dấu phẩy cuối dòng nếu bạn xuống dòng thủ công
line-ending = "auto"           # Tự động nhận diện xuống dòng theo OS

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: test chạy lâu, có thể skip khi dev nhanh (pytest -m 'not slow')",
    "unit: pure unit test, không I/O",
    "integration: test có DB/HTTP",
    "e2e: test luồng nghiệp vụ đầy đủ",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/alembic/*", "app/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
